<!DOCTYPE html>
<html>
<head>
    <title>V4 – Rotating Star</title>
    <style>
        body { background-color: #888; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { border: 1px solid #333; }
    </style>
</head>
<body>
    <canvas id="gl-canvas" width="512" height="512"></canvas>

    <!--
        Same as v3 but a time uniform t is added to the angle each frame,
        making the star rotate continuously via requestAnimationFrame.
    -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es

        uniform float N, t;

        void main() {
            if (gl_VertexID == 0) {
                gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
                return;
            }

            float vid = float(gl_VertexID);
            const float Pi = 3.14159265358979;
            float angle = vid * 2.0 * Pi / N + t;

            float radius = (gl_VertexID % 2 == 0) ? 1.0 : 0.4;
            vec2 v = radius * vec2(cos(angle), sin(angle));
            gl_Position = vec4(v, 0.0, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es

        precision mediump float;
        out vec4 fColor;

        void main() {
            fColor = vec4(1.0, 1.0, 0.0, 1.0);
        }
    </script>

    <script>
        function initShaders(gl, vertexShaderId, fragmentShaderId) {
            var vertElem = document.getElementById(vertexShaderId);
            if (!vertElem) { alert("Cannot find vertex shader: " + vertexShaderId); return -1; }
            var vertShdr = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertShdr, vertElem.text.trim());
            gl.compileShader(vertShdr);
            if (!gl.getShaderParameter(vertShdr, gl.COMPILE_STATUS)) {
                alert("Vertex shader error:\n" + gl.getShaderInfoLog(vertShdr)); return -1;
            }
            var fragElem = document.getElementById(fragmentShaderId);
            if (!fragElem) { alert("Cannot find fragment shader: " + fragmentShaderId); return -1; }
            var fragShdr = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragShdr, fragElem.text.trim());
            gl.compileShader(fragShdr);
            if (!gl.getShaderParameter(fragShdr, gl.COMPILE_STATUS)) {
                alert("Fragment shader error:\n" + gl.getShaderInfoLog(fragShdr)); return -1;
            }
            var program = gl.createProgram();
            gl.attachShader(program, vertShdr);
            gl.attachShader(program, fragShdr);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                alert("Shader link error:\n" + gl.getProgramInfoLog(program)); return -1;
            }
            return program;
        }
    </script>
    <script>
        window.onload = function () {
            var canvas = document.getElementById("gl-canvas");
            var gl = canvas.getContext("webgl2");
            if (!gl) { alert("WebGL2 is not available in your browser."); return; }

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.3, 0.3, 0.3, 1.0);

            var program = initShaders(gl, "vertex-shader", "fragment-shader");
            gl.useProgram(program);

            var N = 10;
            var uN = gl.getUniformLocation(program, "N");
            gl.uniform1f(uN, N);

            var t = 0.0;
            var uT = gl.getUniformLocation(program, "t");

            render();

            function render() {
                gl.clear(gl.COLOR_BUFFER_BIT);

                t += 0.01;
                gl.uniform1f(uT, t);

                gl.drawArrays(gl.TRIANGLE_FAN, 0, N + 2);
                requestAnimationFrame(render);
            }
        };
    </script>
</body>
</html>
