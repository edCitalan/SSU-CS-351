<!DOCTYPE html>
<html>
<head>
    <title>V3 – Five-Pointed Star</title>
    <style>
        body { background-color: #888; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { border: 1px solid #333; }
    </style>
</head>
<body>
    <canvas id="gl-canvas" width="512" height="512"></canvas>

    <!--
        Same triangle fan as v2 (N=10 sides, 12 vertices), but now the radius alternates:
        Even vertex IDs (2,4,6,8,10) → outer tips at full radius = 1.0
        Odd vertex IDs  (1,3,5,7,9,11) → inner valleys at radius = 0.4
        Vertex 0 remains the center at the origin.
    -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        #version 300 es

        uniform float N;

        void main() {
            if (gl_VertexID == 0) {
                gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
                return;
            }

            float vid = float(gl_VertexID);
            const float Pi = 3.14159265358979;
            float angle = vid * 2.0 * Pi / N;

            float radius = (gl_VertexID % 2 == 0) ? 1.0 : 0.4;
            vec2 v = radius * vec2(cos(angle), sin(angle));
            gl_Position = vec4(v, 0.0, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        #version 300 es

        precision mediump float;
        out vec4 fColor;

        void main() {
            fColor = vec4(1.0, 1.0, 0.0, 1.0);
        }
    </script>

    <script src="initShaders.js"></script>
    <script>
        window.onload = function () {
            var canvas = document.getElementById("gl-canvas");
            var gl = canvas.getContext("webgl2");
            if (!gl) { alert("WebGL2 is not available in your browser."); return; }

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.3, 0.3, 0.3, 1.0);

            var program = initShaders(gl, "vertex-shader", "fragment-shader");
            gl.useProgram(program);

            var N = 10;
            var uN = gl.getUniformLocation(program, "N");
            gl.uniform1f(uN, N);

            render();

            function render() {
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_FAN, 0, N + 2);
            }
        };
    </script>
</body>
</html>
